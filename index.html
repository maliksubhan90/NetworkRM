<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NetworkRM — Your network, in one place</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">NR</div>
        <div class="brand-text">
          <div class="brand-name">NetworkRM</div>
          <div class="brand-tag">Personal rolodex</div>
        </div>
      </div>

      <nav class="nav">
        <a href="#/dashboard" class="nav-link" data-nav="dashboard">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.6" y="2.6" width="6" height="6" rx="1.4"/><rect x="11.4" y="2.6" width="6" height="6" rx="1.4"/><rect x="2.6" y="11.4" width="6" height="6" rx="1.4"/><rect x="11.4" y="11.4" width="6" height="6" rx="1.4"/></svg>
          Overview
        </a>
        <a href="#/contacts" class="nav-link" data-nav="contacts">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7.5" r="3.1"/><path d="M4.5 16.5c.7-2.9 2.9-4.7 5.5-4.7s4.8 1.8 5.5 4.7"/></svg>
          Contacts
          <span class="nav-count" id="navContacts"></span>
        </a>
        <a href="#/gmail" class="nav-link" data-nav="gmail">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.4" y="4.2" width="15.2" height="11.6" rx="2"/><path d="m3.2 6 6.8 5 6.8-5"/></svg>
          Gmail
          <span class="nav-dot" id="navGmailDot"></span>
        </a>
        <a href="#/settings" class="nav-link" data-nav="settings">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12.4a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8Z"/><path d="M16.4 10.9v-1.8l-2-.7a6 6 0 0 0-.7-1.6l1-1.8-1.3-1.3-1.8 1a6 6 0 0 0-1.6-.7l-.7-2h-1.8l-.7 2a6 6 0 0 0-1.6.7l-1.8-1L2.7 5.9l1 1.8a6 6 0 0 0-.7 1.6l-2 .7v1.8l2 .7c.2.6.4 1.1.7 1.6l-1 1.8 1.3 1.3 1.8-1c.5.3 1 .5 1.6.7l.7 2h1.8l.7-2c.6-.2 1.1-.4 1.6-.7l1.8 1 1.3-1.3-1-1.8c.3-.5.5-1 .7-1.6l2-.7Z"/></svg>
          Settings
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="sync-card">
          <span class="sync-dot" id="footDot"></span>
          <span class="sync-label" id="footLabel">Checking…</span>
          <button class="sync-btn" id="footSync">Sync</button>
        </div>
        <p class="sidebar-note">Built from your email. Kept by you.</p>
      </div>
    </aside>

    <main class="main" id="view"></main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="parser.js"></script>
  <script src="app.js"></script>
</body>
</html>
